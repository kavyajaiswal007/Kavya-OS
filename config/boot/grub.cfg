set default=0
set timeout=0

# Load video drivers and graphical terminal
insmod font
if loadfont /boot/grub/fonts/unicode.pf2 ; then
    set gfxmode=auto
    insmod gfxterm
    insmod vbe
    insmod vga
    terminal_output gfxterm
fi

insmod png
insmod jpeg

# Theme / Background if present
if [ -f /boot/grub/splash.png ]; then
    background_image /boot/grub/splash.png
fi

set menu_color_normal=white/black
set menu_color_highlight=cyan/black

menuentry "KAVYA OS (Live Desktop)" --class debian --class gnu-linux --class gnu --class os {
    linux /live/vmlinuz boot=live components hostname=kavya-os username=kavya locales=en_US.UTF-8 keyboard-layouts=us timezone=Etc/UTC quiet loglevel=0 vt.global_cursor_default=0
    initrd /live/initrd.img
}

menuentry "KAVYA OS (Failsafe / Safe Graphics)" --class debian --class gnu-linux --class gnu --class os {
    linux /live/vmlinuz boot=live components hostname=kavya-os username=kavya nomodeset noapic noacpi nosplash
    initrd /live/initrd.img
}

menuentry "Reboot PC" {
    reboot
}

menuentry "Power Off PC" {
    halt
}
